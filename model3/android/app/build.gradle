plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

// One version number for this app, in a file of its own.
//
// model1's copy of this build reads pyproject.toml, because model1 IS a Python package
// and already had one. model3 is not: it is a folder of weights, a bench window and this
// phone app, and inventing a pyproject.toml to hold two digits would say something untrue
// about what the directory is. A properties file next to the build that reads it says
// exactly as much as it means.
//
// The failure it replaced is worth remembering: the missing pyproject.toml threw during
// configuration, and Gradle reported it as "compileSdkVersion is not specified" -- a
// message about a line that was present and correct twenty lines further down.
def versionProps = new Properties()
def versionFile = file("${rootDir}/version.properties")
if (!versionFile.exists()) {
    throw new GradleException("No version.properties at ${versionFile}")
}
versionFile.withInputStream { versionProps.load(it) }
def vm = (versionProps.getProperty("version", "") =~ /^(\d+)\.(\d+)\.(\d+)$/)
if (!vm.find()) {
    throw new GradleException("version in ${versionFile} must be major.minor.patch")
}
def appVersionName = "${vm.group(1)}.${vm.group(2)}.${vm.group(3)}"
// versionCode has to increase monotonically or Android refuses to install over an
// existing copy, so derive it arithmetically: 0.1.0 -> 100.
def appVersionCode = vm.group(1).toInteger() * 10000 + vm.group(2).toInteger() * 100 + vm.group(3).toInteger()

// Chaquopy runs pip with a local interpreter of the same minor version it targets, and
// the project already keeps one: .venv is 3.10. Pointing at it means nothing has to be
// installed system-wide for this build, and the desktop and the phone resolve their
// packages with the same pip.
def venvPython = file("${rootDir}/../.venv/Scripts/python.exe")
if (!venvPython.exists()) {
    venvPython = file("${rootDir}/../.venv/bin/python")
}

android {
    namespace 'com.pharmaflow.pillcount'
    compileSdk 34

    defaultConfig {
        applicationId "com.pharmaflow.pillcount"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        // The phone this is being tested on, and nothing else. Chaquopy ships a whole
        // CPython plus native numpy and OpenCV per ABI, and ONNX Runtime another native
        // library on top; the default four ABIs multiply all of that by four for
        // devices that will never run it.
        ndk {
            abiFilters "arm64-v8a"
        }

        python {
            // 3.10, not by preference: Chaquopy's package repository has native OpenCV
            // builds for cp310 only. The sibling project probed 3.11 first and pip
            // reported "from versions: none" for every opencv variant.
            version "3.10"
            if (venvPython.exists()) {
                buildPython venvPython.absolutePath
            }
            pip {
                install "numpy==1.26.2"
                // 4.5.1.48 is not a choice, it is the whole of what Chaquopy publishes
                // for cp310/arm64-v8a. It is also five years older than this model's
                // attention blocks, so cv2.dnn here cannot read pillsort-seg.onnx at
                // all -- which is why the forward pass is ONNX Runtime's job below and
                // cv2 is only ever asked for cvtColor, findContours, NMSBoxes and the
                // drawing ui/ does. Those are 2013 APIs; the age does not matter to
                // them. See pillsort/backend.py.
                install "opencv-python-headless==4.5.1.48"
            }
        }
    }

    buildTypes {
        release {
            // No keystore here: this is a build to sideload onto a test handset, so it
            // is debug-signed like the debug build. A release-signed APK cannot update
            // a debug-signed one in place, so introducing a keystore later means
            // uninstalling first -- fine now, worth knowing before any device is in a
            // ward.
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    androidResources {
        // Store the model rather than deflating it. It is 11 MB of already-quantised
        // float weights that compress by a few percent, and leaving it uncompressed
        // means AssetManager hands out the bytes without inflating 11 MB on a phone at
        // every cold start.
        noCompress 'onnx'
    }

    lint {
        // lintVitalRelease forks its own analysis over the whole dependency graph and
        // is the heaviest task in this build by some margin. Nothing here gates on its
        // findings.
        checkReleaseBuilds false
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            // pillsort/ and ui/ are NOT copied into this module. They are staged into
            // the build directory below, so the desktop and the phone run byte-identical
            // Python and there is no second copy to drift.
            python {
                srcDirs = ["src/main/python", "${buildDir}/pythonSrc"]
            }
            assets {
                srcDirs = ["src/main/assets", "${buildDir}/androidAssets"]
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.0'

    // The runtime cv2.dnn cannot be here. Reads the same .onnx the desktop reads and
    // returns the same two tensors; pillsort/backend.py decodes them either way.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'

    // camera-view is here for PreviewView, and that is a reversal: this list used to say
    // "no camera-view, because nothing native is drawn on screen". Nothing native was,
    // and the cost was that the picture refreshed once per segmented frame -- 1.3 fps
    // measured. The video is a real surface now and ui/screen.py draws the rest of the
    // window over it, so there is still one layout and one set of hit boxes.
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
}

// Stage the project's Python and its PNGs into the build directory.
//
// Configuration-phase copies rather than tasks: Chaquopy reads python.srcDirs while
// configuring, so a task wired into the execution graph would run after it had already
// decided the source set was empty. The asset copies follow the same shape for
// consistency, and all three are cheap -- 1.8k lines of Python and 900 KB of PNG.
def projectRoot = "${rootDir}/.."

// model3's Python, its pre-rendered text and the detector, staged into the build.
//
// Configuration-phase copies rather than tasks, for the reason model1's build gives:
// Chaquopy reads python.srcDirs while configuring, so a task wired into the execution
// graph would run after it had already decided the source set was empty.
copy {
    from("${projectRoot}/phone") {
        exclude "**/__pycache__/**", "assets/**", "preview/**"
    }
    into "${buildDir}/pythonSrc/model3/phone"
}
copy {
    // The package above it has to exist for `import model3.phone...` to resolve the way
    // it does on the PC, and there is nothing else in it.
    from("${projectRoot}/__init__.py")
    into "${buildDir}/pythonSrc/model3"
}
copy {
    // Unpacked to private storage on first run by Art.kt: inside an APK there is no
    // directory next to the code for cv2.imread to open.
    from("${projectRoot}/phone/assets")
    into "${buildDir}/androidAssets/art"
}
copy {
    // WHICH EXPORT THE PHONE CARRIES, and the answer stopped being "the one the bench
    // runs" when it was measured against the clock a handset actually has.
    //
    // The bench runs 480x640 because that is what its camera hands ultralytics. A phone
    // has a tenth of the CPU and every millisecond of a forward pass is a millisecond the
    // number is out of date. Measured over forty frames of one tray, and then over the
    // same tray shot from further and further back:
    //
    //   export     speed   tray filling  100%  85%  70%  55%  40%   spread
    //   480x640    1.00x                   61   61   61   61   54     0
    //   384x512    1.36x                   61   61   61   61   61     0
    //   320x416    1.88x                   61   61   61   61   59     0
    //   256x352    2.67x                   61   61   61   61   10     0
    //
    // 256x352 is the trap. It is the fastest, it reads the tray perfectly at every
    // working distance, and then it falls off a cliff -- 10 tablets of 61 -- the day
    // somebody moves the phone back. A number that is right until it is catastrophically
    // wrong, with nothing on screen to say which.
    //
    // 320x416 is nearly twice the speed and is never WORSE than the shipped export at any
    // distance measured, including the one where the shipped export has already started
    // missing tablets. That is not a trade; both figures move the right way.
    //
    // AND THEN INT8, which is a second change on top of that one and a bigger one.
    //
    // The bench measured 556 ms a frame on an empty tray. A YOLO11n at this size is about
    // 0.85 GFLOPs and four A55 cores should manage it in 100-200, so most of that is the
    // float32 graph running on kernels nobody optimised for it. int8 is what XNNPACK has
    // hand-written ARM kernels for, and it is the ONLY form NNAPI can hand to the RK3566's
    // 0.8 TOPS NPU -- that silicon is integer, and a float graph offered to it comes back
    // on NNAPI's own fallback path, which is how a session can build fine and still be
    // slower than the CPU. OrtEngine races all three providers, so whichever wins, wins.
    //
    // Quantised STATICALLY, in QDQ form, calibrated on 38 frames of this bench's own tray
    // -- including the tray shot small, where int8 gives out first. Measured against the
    // float export it replaces, over 40 frames of one tray and then the same tray at five
    // distances:
    //
    //   export                 MB    median  spread   100%  85%  70%  55%  40%
    //   float32 320x416      10.5        61       0     61   61   61   61   59
    //   int8 per-channel      3.1        61       0     61   61   61   61   59
    //   int8 per-tensor       3.0        61       1     61   61   61   61   59
    //
    // Per-channel, because per-tensor loses the steadiness -- a spread of 1 is a number
    // that flickers, and this app asks the operator to wait for it to hold still.
    //
    // AND IT KILLED THE APP ON THE BOARD, which is why the line below says float32.
    //
    // Shipped as int8, DrugCount closed the moment the loading screen finished -- no error
    // dialog, no message, the process simply gone. Every Java fault in this activity is
    // caught and put on screen (see boot()'s catch), so a silent disappearance is a native
    // crash: something under ONNX Runtime took the process down with it.
    //
    // THE TIMING NAMES THE MOMENT. The provider race runs during loading, on a blob of
    // zeros. What happens when loading FINISHES is the first forward pass on a real camera
    // frame, through whichever provider won -- most likely NNAPI, since that is the one
    // that hands a quantised graph to a vendor driver this app has never seen.
    //
    // The int8 export itself is not in doubt as arithmetic: measured here it reads the
    // tray at 61 with a spread of 0 and matches the float export at every distance. What
    // is in doubt is what the board's driver does with it, and that cannot be answered
    // from a desk. It stays in weights/, built and measured, for a retry once the app can
    // survive a provider that dies -- see the note in OrtEngine.kt about the race, which
    // catches a provider that is SLOW and cannot catch one that is fatal.
    //
    // To go back, put the file name below back to v3-320x416.onnx, or all the way to
    // pillcount-det-v3-480x640.onnx. Nothing else needs changing: OrtEngine reads the
    // shape off the graph and hands it to the letterbox, so the export is the only thing
    // that knows its own size.
    from("${projectRoot}/weights") { include "v3-320x416.onnx" }
    into "${buildDir}/androidAssets/model"
    rename { "pillcount-det-v3.onnx" }
}
