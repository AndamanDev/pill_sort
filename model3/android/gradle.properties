# Kept below AGP's 2 GB default. One module, one activity; a smaller heap costs nothing
# here and Android builds are the first thing to fail on a workstation that is also
# running an IDE and a browser. The failure does not say so: the Gradle daemon vanishes
# mid-build, the reported error is "daemon disappeared unexpectedly", and the real cause
# is only in an hs_err_pid*.log dropped in this directory.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Single module, so parallel execution buys nothing and doubles peak memory.
org.gradle.parallel=false
org.gradle.caching=true

# Compile Kotlin inside the Gradle daemon rather than forking a second JVM.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
